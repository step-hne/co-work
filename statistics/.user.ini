; ─── PHP 8.3 runtime settings (cPanel / ea-php83) ────────────────────────────
; Applied per-directory by PHP CGI/FPM. Do not set PHP_INI_SYSTEM directives
; here (e.g. allow_url_fopen) — use cPanel MultiPHP INI Editor for those.

; ─── Error handling ───────────────────────────────────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; error_log = /home/USERNAME/logs/statistics_php_error.log

; ─── Resource limits ──────────────────────────────────────────────────────────
max_execution_time = 60
max_input_time = 60
max_input_vars = 500
memory_limit = 256M
post_max_size = 2M
upload_max_filesize = 2M
max_file_uploads = 5

; ─── Session ──────────────────────────────────────────────────────────────────
session.gc_maxlifetime = 1440
session.save_path = "/home/pemberon/php_sessions"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict

; ─── Security hardening ───────────────────────────────────────────────────────
expose_php = Off
allow_url_include = Off
enable_dl = Off
; allow_url_fopen is PHP_INI_SYSTEM — set via cPanel MultiPHP INI Editor to Off
; disable_functions = exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec

; ─── Output / encoding ────────────────────────────────────────────────────────
zlib.output_compression = Off
output_buffering = Off
default_charset = UTF-8
mbstring.internal_encoding = UTF-8
mbstring.language = Neutral
