; ─── PHP 8.3 runtime settings (cPanel / ea-php83) ────────────────────────────
; Applied per-directory by PHP CGI/FPM. Reload not needed on cPanel —
; values take effect within php_ini_scanned_files cache TTL (~5 min).

; ─── Error handling ───────────────────────────────────────────────────────────
; Never expose errors to the browser in production
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; Absolute path or relative to document root
; error_log = /home/USERNAME/logs/php_error.log

; ─── Resource limits ──────────────────────────────────────────────────────────
max_execution_time = 30
max_input_time = 30
memory_limit = 128M
post_max_size = 2M
upload_max_filesize = 2M
max_file_uploads = 5
max_input_vars = 500

; ─── Session security ─────────────────────────────────────────────────────────
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.gc_maxlifetime = 1440

; ─── Character encoding ───────────────────────────────────────────────────────
default_charset = UTF-8
mbstring.internal_encoding = UTF-8
mbstring.language = Neutral

; ─── Security hardening ───────────────────────────────────────────────────────
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off
; Disable dangerous functions not used by this application
disable_functions = exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec,pcntl_fork,pcntl_signal,parse_ini_file,show_source,eval

; ─── Output ───────────────────────────────────────────────────────────────────
output_buffering = Off
zlib.output_compression = Off
